description: The Sprkey desktop app in your browser. `sprkey workbench` serves the desktop interface through the Sprkey dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `sprkey workbench` run and again after each Sprkey update it runs `npm install --ignore-scripts` (guided by Sprkey's lockfile) and Vite against your Sprkey checkout's desktop sources, writing only under ~/.sprkey/sprkey-workbench and its own plugin dir (the checkout is only read), and starts `sprkey dashboard` on loopback when none is running.
